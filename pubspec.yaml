name: horus_system
description: "H.O.R.U.S System — Heavy Operations & Route Unified System. A SaaS platform for heavy transport operations."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any

  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
