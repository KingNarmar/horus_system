name: horus_system
description: "H.O.R.U.S System — Heavy Operations & Route Unified System. A SaaS platform for heavy transport operations."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any
  common_locale_data: ^2.2.1
  connectivity_plus: ^7.1.1
  timezone: ^0.11.1

  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1
  file_picker: ^13.1.0
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.2.3
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.14.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  msix: ^3.18.0
  test: ^1.25.15

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env

msix_config:
  display_name: HORUS System
  publisher_display_name: King Narmar
  identity_name: KingNarmar.HORUSSystem
  publisher: CN=E9CE55B8-AEDA-43A1-9E0C-43ADE997A176
  msix_version: 1.0.0.0
  architecture: x64
  capabilities: internetClient
  output_name: horus-system-store
  store: true
