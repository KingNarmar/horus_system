name: Issue 351 Branding Signed JWT and Issuer Snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'scripts/security/verify_issue_351_branding.py'
      - '.github/workflows/issue-351-signed-jwt.yml'

permissions:
  contents: read

concurrency:
  group: horus-351-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branding-security:
    name: Disposable signed-JWT company branding acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Check isolated test syntax
        run: python -m py_compile scripts/security/verify_issue_351_branding.py

      - name: Confirm disposable environment
        shell: bash
        run: |
          test ! -e supabase/config.toml
          test ! -e supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          npx --yes supabase@3.0.0 init

      - name: Start and reset local Supabase
        run: |
          npx --yes supabase@3.0.0 start
          npx --yes supabase@3.0.0 db reset --local --no-seed

      - name: Verify signed-JWT role/tenant, Storage and issuer contract
        run: python scripts/security/verify_issue_351_branding.py

      - name: Discard local services and fixtures
        if: always()
        run: |
          if test -e supabase/config.toml; then
            npx --yes supabase@3.0.0 stop --no-backup || true
          fi
