name: Issue 204 Validation

on:
  push:
    branches:
      - fix/204-atomic-company-onboarding
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Prepare safe test environment
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify diff whitespace
        run: git diff --check

      - name: Verify clean working tree
        run: |
          git status --short
          test -z "$(git status --short)"
