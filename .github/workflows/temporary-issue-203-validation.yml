name: Temporary Issue 203 Validation

on:
  push:
    branches:
      - feature/203-company-invitations-membership-lifecycle

permissions:
  contents: read

jobs:
  validate-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Show formatter diff
        shell: bash
        run: |
          dart format lib/features/company/presentation/cubit/company_invitations_cubit.dart test/features/company/presentation/cubit/company_invitations_cubit_test.dart
          git diff -- lib/features/company/presentation/cubit/company_invitations_cubit.dart test/features/company/presentation/cubit/company_invitations_cubit_test.dart
          test -z "$(git status --short -- lib/features/company/presentation/cubit/company_invitations_cubit.dart test/features/company/presentation/cubit/company_invitations_cubit_test.dart)"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  validate-edge-function:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Invitation token tests
        run: deno test supabase/functions/send-company-invitation/company_invitation_token_test.ts

      - name: Invitation email template tests
        run: deno test supabase/functions/send-company-invitation/invitation_email_template_test.ts
