name: Temporary Issue 203 Validation

on:
  push:
    branches:
      - feature/203-company-invitations-membership-lifecycle

permissions:
  contents: read

jobs:
  validate-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed lib test

      - name: Prepare CI environment file
        run: touch .env

      - name: Analyze full project for errors
        run: flutter analyze --no-fatal-warnings

      - name: Analyze company feature strictly
        run: flutter analyze lib/features/company test/features/company

      - name: Test
        run: flutter test

  validate-edge-function:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Invitation token tests
        run: deno test supabase/functions/send-company-invitation/company_invitation_token_test.ts

      - name: Invitation email template tests
        run: deno test supabase/functions/send-company-invitation/invitation_email_template_test.ts
