name: Temporary Issue 203 Entry Validation

on:
  push:
    branches:
      - feature/203-company-invitations-membership-lifecycle

permissions:
  contents: read

jobs:
  formatter-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Print formatter diff
        run: |
          dart format test/features/company/presentation/pages/company_entry_page_test.dart
          git diff -- test/features/company/presentation/pages/company_entry_page_test.dart
