name: Issue 351 Company Branding UI Quality

on:
  push:
    branches:
      - feature/351-company-branding-ui
  pull_request:
    branches:
      - feature/351-company-branding-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horus-351-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: git diff --check
