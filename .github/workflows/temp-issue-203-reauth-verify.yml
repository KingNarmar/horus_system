name: temp-issue-203-reauth-verify

on:
  push:
    branches:
      - feature/203-company-invitations-membership-lifecycle

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          if [ ! -f .env ]; then
            printf 'SUPABASE_URL=https://example.supabase.co\nSUPABASE_ANON_KEY=example-anon-key\n' > .env
          fi
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze --no-fatal-warnings
      - run: flutter analyze lib/features/company lib/app/routing test/features/company test/app/routing
      - run: flutter test
