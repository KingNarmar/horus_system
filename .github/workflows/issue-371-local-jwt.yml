name: Issue 371 Expense Category Write Lockdown

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'scripts/security/verify_issue_371_local_http.py'
      - '.github/workflows/issue-371-local-jwt.yml'

permissions:
  contents: read

concurrency:
  group: horus-371-local-jwt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  category-security:
    name: Disposable signed-JWT categories and onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Compile focused Python security test
        run: python -m py_compile scripts/security/verify_issue_371_local_http.py

      - name: Verify only disposable local Supabase can be used
        shell: bash
        run: |
          test ! -e supabase/config.toml
          test ! -e supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          npx --yes supabase@3.0.0 init

      - name: Start isolated local Supabase
        run: npx --yes supabase@3.0.0 start

      - name: Rebuild disposable database from all versioned migrations
        run: npx --yes supabase@3.0.0 db reset --local --no-seed

      - name: Verify real JWT roles, denied writes, read RLS and onboarding seed
        run: python scripts/security/verify_issue_371_local_http.py

      - name: Remove isolated test stack and all fixtures
        if: always()
        run: |
          if test -e supabase/config.toml; then
            npx --yes supabase@3.0.0 stop --no-backup || true
          fi
