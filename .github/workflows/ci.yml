name: H.O.R.U.S CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: horus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Run architecture tests
        run: flutter test test/architecture

      - name: Analyze
        run: flutter analyze

      - name: Run full test suite
        run: flutter test

  android-release:
    name: Android Release Build
    needs: quality
    runs-on: ubuntu-latest
    env:
      CI_SUPABASE_URL: "https://ci.invalid.supabase.co"
      CI_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_only_not_for_runtime"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Create disposable CI signing material
        shell: bash
        run: |
          CI_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$CI_KEYSTORE_PASSWORD"

          keytool -genkeypair -keystore android/ci-upload.jks -storepass "$CI_KEYSTORE_PASSWORD" -keypass "$CI_KEYSTORE_PASSWORD" -alias upload -keyalg RSA -keysize 2048 -validity 1 -dname "CN=HORUS CI, OU=CI, O=King Narmar, L=Dubai, ST=Dubai, C=AE"

          cat > android/key.properties <<EOF
          storePassword=$CI_KEYSTORE_PASSWORD
          keyPassword=$CI_KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=../ci-upload.jks
          EOF

      - name: Build Android release App Bundle
        shell: bash
        run: |
          flutter build appbundle --release --no-pub --dart-define=APP_ENV=production --dart-define=SUPABASE_URL="${CI_SUPABASE_URL}" --dart-define=SUPABASE_PUBLISHABLE_KEY="${CI_SUPABASE_PUBLISHABLE_KEY}" --dart-define=ENABLE_DEBUG_LOGS=false

          test -f build/app/outputs/bundle/release/app-release.aab

      - name: Remove disposable CI signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties android/ci-upload.jks

  windows-release:
    name: Windows Release Build
    needs: quality
    runs-on: windows-latest
    env:
      CI_SUPABASE_URL: "https://ci.invalid.supabase.co"
      CI_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_only_not_for_runtime"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release --no-pub `
            --dart-define=APP_ENV=production `
            --dart-define=SUPABASE_URL="${env:CI_SUPABASE_URL}" `
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${env:CI_SUPABASE_PUBLISHABLE_KEY}" `
            --dart-define=ENABLE_DEBUG_LOGS=false

          if (-not (Test-Path "build/windows/x64/runner/Release/horus.exe")) {
            throw "Expected Windows release executable was not generated."
          }

      - name: Validate Microsoft Store MSIX packaging
        shell: pwsh
        run: |
          dart run msix:create --build-windows false

          if (-not (Test-Path "build/windows/x64/runner/Release/horus-system-store.msix")) {
            throw "Expected Microsoft Store MSIX package was not generated."
          }
