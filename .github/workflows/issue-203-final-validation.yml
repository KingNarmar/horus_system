name: Issue 203 Final Validation

on:
  push:
    branches:
      - feature/203-company-invitations-membership-lifecycle

jobs:
  deno-and-git-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run invitation Edge Function tests
        run: deno test supabase/functions/send-company-invitation/*_test.ts

      - name: Check diff whitespace
        run: git diff --check

      - name: Check working tree clean
        run: |
          test -z "$(git status --short)"
