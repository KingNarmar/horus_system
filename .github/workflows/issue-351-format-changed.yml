name: Issue 351 Format Changed Dart Sources

on:
  push:
    branches:
      - feature/351-company-branding-ui

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Format ONLY Dart changes in the stacked PR
        shell: bash
        run: |
          git fetch origin feature/351-company-branding-foundation
          mapfile -t files < <(git diff --name-only --diff-filter=ACM origin/feature/351-company-branding-foundation...HEAD -- '*.dart')
          if (( ${#files[@]} == 0 )); then exit 0; fi
          dart format "${files[@]}"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(#351): apply Dart formatter to branding changes'
          git push origin HEAD:feature/351-company-branding-ui
