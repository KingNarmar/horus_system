name: Issue 356 Lifetime Trip and Invoice Signed JWT Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'scripts/security/verify_issue_356_local_http.py'
      - '.github/workflows/issue-356-local-jwt.yml'

permissions:
  contents: read

concurrency:
  group: horus-356-local-jwt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lifetime-security:
    name: Disposable signed-JWT lifetime quota, concurrency and idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Compile local-only harness
        run: python -m py_compile scripts/security/verify_issue_356_local_http.py
      - name: Verify isolated local Supabase only
        shell: bash
        run: |
          test ! -e supabase/config.toml
          test ! -e supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          npx --yes supabase@3.0.0 init
      - name: Start disposable Supabase and replay repository migrations
        run: |
          npx --yes supabase@3.0.0 start
          npx --yes supabase@3.0.0 db reset --local --no-seed
      - name: Verify protected lifetime quotas with real signed JWTs
        run: python scripts/security/verify_issue_356_local_http.py
      - name: Stop disposable fixture services
        if: always()
        shell: bash
        run: |
          if test -e supabase/config.toml; then
            npx --yes supabase@3.0.0 stop --no-backup || true
          fi
