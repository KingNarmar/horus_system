name: Issue 353 — isolated high-volume Reports RPCs

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/security/verify_issue_353_large_report_sources.mjs'
      - 'supabase/tests/issue_353_report_large_sources_fixture.sql'
      - '.github/workflows/issue-353-large-reports-local.yml'
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  reports-source-integrity:
    name: Disposable local Supabase / signed-JWT Reports
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Verify no linked hosted project or remote credentials
        shell: bash
        run: |
          test ! -e supabase/config.toml
          test ! -e supabase/.temp/project-ref
          test -z "$SUPABASE_ACCESS_TOKEN"
          test -z "$SUPABASE_DB_PASSWORD"

      - name: Create disposable local Supabase config
        run: |
          npx --yes supabase@3.0.0 init
          test -f supabase/config.toml

      - name: Start isolated local Supabase
        run: npx --yes supabase@3.0.0 start

      - name: Replay migrations into disposable DB without seed data
        run: npx --yes supabase@3.0.0 db reset --local --no-seed

      - name: Ensure local PostgreSQL client exists
        shell: bash
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Verify signed-JWT roles and full report source payloads
        run: node scripts/security/verify_issue_353_large_report_sources.mjs

      - name: Destroy disposable local Supabase
        if: always()
        run: |
          if test -e supabase/config.toml; then
            npx --yes supabase@3.0.0 stop --no-backup || true
          fi
