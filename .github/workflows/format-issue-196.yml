name: Format Issue 196
on:
  push:
    branches: [feature/196-account-deletion-lifecycle]
    paths: [.github/workflows/format-issue-196.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/196-account-deletion-lifecycle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: dart format test/features/auth/data/repositories/account_deletion_repository_impl_test.dart
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/features/auth/data/repositories/account_deletion_repository_impl_test.dart
          git commit -m "style(auth): apply dart formatter"
          git push origin HEAD:feature/196-account-deletion-lifecycle
