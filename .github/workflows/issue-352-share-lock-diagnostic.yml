name: Issue 352 Sharing Dependency Lock Diagnostic

on:
  push:
    branches:
      - feature/352-company-branded-invoice-pdf

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
      - name: Resolve
        run: flutter pub get
      - name: Report lock diff
        shell: bash
        run: |
          echo HORUS_SHARE_LOCK_BEGIN
          git diff -- pubspec.lock
          echo HORUS_SHARE_LOCK_END
