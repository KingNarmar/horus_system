name: Issue 296 Script Verification

on:
  push:
    branches:
      - fix/296-auth-email-batched-patches

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell Script Verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Parse Auth email config script
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/configure_supabase_auth_email.ps1"),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
