name: Temporary Issue 192 Android Release Verification

on:
  push:
    branches:
      - feature/192-android-release-foundation

permissions:
  contents: write

jobs:
  verify-android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Create CI-only application config
        run: |
          cat > .env <<'EOF'
          SUPABASE_URL=https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
          EOF
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties

      - name: Restore standard Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.14 --distribution-type all
          cd ..
          chmod +x android/gradlew

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Verify release signing fails closed without credentials
        run: |
          rm -f android/key.properties android/*.jks android/*.keystore
          flutter clean
          flutter pub get
          if flutter build appbundle --release; then
            echo "Expected release build without android/key.properties to fail."
            exit 1
          fi
          echo "Release build correctly rejected missing signing credentials."

      - name: Generate ephemeral CI upload key
        run: |
          keytool -genkeypair -v \
            -keystore android/horus-ci-upload.jks \
            -storepass ci-password \
            -keypass ci-password \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=H.O.R.U.S CI Upload, OU=CI, O=King Narmer, C=AE"
          cat > android/key.properties <<'EOF'
          storePassword=ci-password
          keyPassword=ci-password
          keyAlias=upload
          storeFile=../horus-ci-upload.jks
          EOF

      - name: Clean and build signed release AAB
        run: |
          flutter clean
          flutter pub get
          flutter build appbundle --release

      - name: Download bundletool
        run: |
          curl -L --fail --silent --show-error \
            -o /tmp/bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar

      - name: Verify release manifest and identity
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          java -jar /tmp/bundletool.jar dump manifest --bundle="$AAB" --module=base > /tmp/release-manifest.xml
          cat /tmp/release-manifest.xml
          grep -q 'package="com.kingnarmar.horus"' /tmp/release-manifest.xml
          grep -q 'android.permission.INTERNET' /tmp/release-manifest.xml
          grep -q 'targetSdkVersion="36"' /tmp/release-manifest.xml

      - name: Verify release signing certificate
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB"
          keytool -list -v \
            -keystore android/horus-ci-upload.jks \
            -storepass ci-password \
            -alias upload > /tmp/expected-cert.txt
          keytool -printcert -jarfile "$AAB" > /tmp/aab-cert.txt
          cat /tmp/aab-cert.txt
          EXPECTED_SHA256=$(grep 'SHA256:' /tmp/expected-cert.txt | head -1 | sed 's/.*SHA256: //; s/://g; s/ //g')
          ACTUAL_SHA256=$(grep 'SHA256:' /tmp/aab-cert.txt | head -1 | sed 's/.*SHA256: //; s/://g; s/ //g')
          test -n "$EXPECTED_SHA256"
          test -n "$ACTUAL_SHA256"
          test "$EXPECTED_SHA256" = "$ACTUAL_SHA256"

      - name: Verify 64-bit native support
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          unzip -l "$AAB" > /tmp/aab-files.txt
          grep 'base/lib/' /tmp/aab-files.txt || true
          grep -q 'base/lib/arm64-v8a/' /tmp/aab-files.txt

      - name: Verify 16 KB bundle alignment
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          java -jar /tmp/bundletool.jar dump config --bundle="$AAB" > /tmp/bundle-config.txt
          cat /tmp/bundle-config.txt
          grep -q 'PAGE_ALIGNMENT_16K' /tmp/bundle-config.txt

      - name: Verify repository diff whitespace
        run: git diff --check

      - name: Commit generated Gradle wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "build: restore standard Gradle wrapper"
            git push origin HEAD:feature/192-android-release-foundation
          fi
